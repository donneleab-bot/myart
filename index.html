<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✦ Star Harlen ✦</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --bg-deep: #05030f; --bg-mid: #120a2a;
    --neon-pink: #ff5ecb; --neon-purple: #a855f7; --neon-blue: #5ecbff;
    --text: #e8e3ff; --text-dim: #a49bd1;
    --card-bg: rgba(18,10,42,.85);
    --border: rgba(168,85,247,.3);
    --glow: rgba(168,85,247,.25);
}

body.theme-cosmos { --bg-deep:#05030f; --bg-mid:#120a2a; --neon-pink:#ff5ecb; --neon-purple:#a855f7; --neon-blue:#5ecbff; --text:#e8e3ff; --text-dim:#a49bd1; --card-bg:rgba(18,10,42,.85); --border:rgba(168,85,247,.3); --glow:rgba(168,85,247,.25); }
body.theme-rose { --bg-deep:#14060f; --bg-mid:#2a0a1e; --neon-pink:#ff5e9b; --neon-purple:#c855f7; --neon-blue:#ff9ecb; --text:#ffe3f0; --text-dim:#d19bb4; --card-bg:rgba(42,10,30,.85); --border:rgba(200,85,247,.3); --glow:rgba(255,94,155,.25); }
body.theme-ocean { --bg-deep:#030f14; --bg-mid:#0a2430; --neon-pink:#5ecbff; --neon-purple:#55f7c8; --neon-blue:#9edcff; --text:#e3f6ff; --text-dim:#9bbcd1; --card-bg:rgba(10,36,48,.85); --border:rgba(85,247,200,.3); --glow:rgba(94,203,255,.25); }
body.theme-sunset { --bg-deep:#140803; --bg-mid:#30140a; --neon-pink:#ff8a5e; --neon-purple:#ff5e7e; --neon-blue:#ffcf5e; --text:#fff0e3; --text-dim:#d1a49b; --card-bg:rgba(48,20,10,.85); --border:rgba(255,94,126,.3); --glow:rgba(255,138,94,.25); }
body.theme-forest { --bg-deep:#03140a; --bg-mid:#0a2a16; --neon-pink:#5effa0; --neon-purple:#c8f755; --neon-blue:#9effc8; --text:#e3ffee; --text-dim:#9bd1ae; --card-bg:rgba(10,42,22,.85); --border:rgba(200,247,85,.3); --glow:rgba(94,255,160,.25); }
body.theme-mono { --bg-deep:#08080a; --bg-mid:#16161a; --neon-pink:#ffffff; --neon-purple:#cccccc; --neon-blue:#999999; --text:#f0f0f0; --text-dim:#888888; --card-bg:rgba(22,22,26,.85); --border:rgba(200,200,200,.25); --glow:rgba(255,255,255,.15); }
body.theme-bi { --bg-deep:#0b0518; --bg-mid:#1d0d38; --neon-pink:#ff6ec7; --neon-purple:#b57bff; --neon-blue:#6ea8ff; --text:#f0e9ff; --text-dim:#b1a3d4; --card-bg:rgba(29,13,56,.86); --border:rgba(181,123,255,.32); --glow:rgba(255,110,199,.28); }
body.theme-custom { }

html, body {
    min-height: 100%;
    background: radial-gradient(ellipse at bottom, var(--bg-mid) 0%, var(--bg-deep) 100%);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow-x: hidden;
    transition: background .6s ease, color .6s ease;
}

.hidden { display: none !important; }

#starfield { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -3; }
.dust-layer {
    position: fixed; inset: 0; pointer-events: none; z-index: -2;
    background-image:
        radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,.6), transparent),
        radial-gradient(1px 1px at 70% 60%, color-mix(in srgb, var(--neon-pink) 50%, transparent), transparent),
        radial-gradient(2px 2px at 40% 80%, color-mix(in srgb, var(--neon-blue) 40%, transparent), transparent),
        radial-gradient(1px 1px at 85% 15%, rgba(255,255,255,.5), transparent);
    background-size: 300px 300px, 400px 400px, 500px 500px, 350px 350px;
    animation: dustDrift 60s linear infinite;
}
@keyframes dustDrift { from { background-position: 0 0,0 0,0 0,0 0; } to { background-position: 300px 600px,-400px 400px,500px -500px,-350px 350px; } }
.orb { position: fixed; border-radius: 50%; filter: blur(80px); pointer-events: none; z-index: -1; opacity: .55; animation: orbFloat 18s ease-in-out infinite; }
.orb--1 { width: 420px; height: 420px; background: radial-gradient(circle, var(--neon-pink), transparent 70%); top: -120px; left: -120px; }
.orb--2 { width: 500px; height: 500px; background: radial-gradient(circle, var(--neon-blue), transparent 70%); bottom: -180px; right: -180px; animation-delay: -6s; }
.orb--3 { width: 360px; height: 360px; background: radial-gradient(circle, var(--neon-purple), transparent 70%); top: 40%; left: 60%; animation-delay: -12s; }
@keyframes orbFloat { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(60px,-40px) scale(1.15); } }

.neon-title {
    font-size: clamp(1.8rem, 4vw, 3rem);
    letter-spacing: 2px;
    background: linear-gradient(90deg, var(--neon-blue), var(--neon-pink), var(--neon-purple));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 24px color-mix(in srgb, var(--neon-pink) 35%, transparent);
    animation: glowPulse 4s ease-in-out infinite;
}
@keyframes glowPulse {
    0%,100% { filter: drop-shadow(0 0 8px color-mix(in srgb, var(--neon-pink) 40%, transparent)); }
    50%     { filter: drop-shadow(0 0 22px color-mix(in srgb, var(--neon-purple) 70%, transparent)); }
}

/* ===== ВОЗРАСТНЫЕ ГЕЙТЫ ===== */
.age-gate {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(5,3,15,.92); backdrop-filter: blur(10px); z-index: 1000; padding: 20px;
}
.age-gate__card {
    max-width: 520px; width: 100%; padding: 40px 32px; text-align: center;
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 24px;
    box-shadow: 0 0 60px var(--glow);
    animation: cardIn .6s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes cardIn { from { opacity: 0; transform: scale(.92) translateY(20px); } to { opacity: 1; transform: none; } }
.age-gate__card p { margin: 20px 0 28px; color: var(--text-dim); line-height: 1.6; }
.age-gate__buttons { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }

.btn {
    padding: 12px 28px; border-radius: 999px; border: none;
    font-size: 1rem; cursor: pointer; transition: all .3s ease;
    font-weight: 600; font-family: inherit;
}
.btn--primary {
    background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
    color: #fff;
    box-shadow: 0 0 20px color-mix(in srgb, var(--neon-pink) 40%, transparent);
}
.btn--primary:hover { transform: translateY(-2px); box-shadow: 0 0 32px color-mix(in srgb, var(--neon-pink) 70%, transparent); }
.btn--ghost { background: transparent; color: var(--text-dim); border: 1px solid var(--border); }
.btn--ghost:hover { color: var(--text); border-color: var(--neon-pink); }

.topnav {
    display: flex; justify-content: space-between; align-items: center;
    padding: 18px 24px; position: relative; z-index: 10;
    backdrop-filter: blur(12px);
    background: color-mix(in srgb, var(--bg-deep) 40%, transparent);
    border-bottom: 1px solid color-mix(in srgb, var(--border) 50%, transparent);
    flex-wrap: wrap; gap: 10px;
}
.topnav__brand {
    color: var(--neon-pink); font-weight: 700; letter-spacing: 1px;
    text-decoration: none; font-size: 1.05rem;
    text-shadow: 0 0 12px color-mix(in srgb, var(--neon-pink) 60%, transparent);
}
.topnav__links { display: flex; gap: 10px; flex-wrap: wrap; }
.topnav__links a {
    color: var(--text-dim); text-decoration: none; padding: 8px 16px; border-radius: 999px;
    transition: all .25s; font-size: .9rem; border: 1px solid transparent;
}
.topnav__links a:hover, .topnav__links a.active {
    color: var(--text); border-color: var(--border);
    background: color-mix(in srgb, var(--neon-purple) 12%, transparent);
    box-shadow: 0 0 16px color-mix(in srgb, var(--neon-purple) 30%, transparent);
}

.app { max-width: 1200px; margin: 0 auto; padding: 20px 20px 80px; position: relative; }
.page { animation: fadeIn .5s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* ===== ГЛАВНАЯ / ГЕРОЙ ===== */
.hero { text-align: center; padding: 40px 0 60px; }
.hero__avatar-wrap {
    width: 180px; height: 180px; margin: 0 auto 28px; border-radius: 50%; padding: 5px;
    background: conic-gradient(var(--neon-pink), var(--neon-blue), var(--neon-purple), var(--neon-pink));
    animation: spinSlow 14s linear infinite;
    box-shadow: 0 0 60px var(--glow), 0 0 100px color-mix(in srgb, var(--neon-pink) 25%, transparent);
    position: relative;
}
.hero__avatar-wrap::after {
    content: ''; position: absolute; inset: -8px; border-radius: 50%;
    border: 1px dashed color-mix(in srgb, var(--neon-blue) 40%, transparent);
    animation: spinSlow 24s linear infinite reverse;
}
@keyframes spinSlow { to { transform: rotate(360deg); } }
.hero__avatar {
    width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: var(--bg-deep);
    animation: spinSlow 14s linear infinite reverse;
}
.hero__bio { color: var(--text-dim); margin-top: 16px; font-size: 1.1rem; max-width: 560px; margin-left: auto; margin-right: auto; }

.comm-status {
    display: inline-flex; align-items: center; gap: 10px; margin-top: 22px;
    padding: 10px 24px; border-radius: 999px; font-weight: 600; font-size: .95rem;
    background: var(--card-bg); border: 1px solid var(--border);
    backdrop-filter: blur(10px);
}
.comm-status__dot { width: 11px; height: 11px; border-radius: 50%; }
.comm-status__dot.on { background: #3ddc84; box-shadow: 0 0 14px #3ddc84; animation: pulse 1.6s infinite; }
.comm-status__dot.off { background: #ff5555; box-shadow: 0 0 8px #ff555566; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }

.links { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 32px; }
.links a {
    padding: 10px 22px; border-radius: 999px;
    background: color-mix(in srgb, var(--neon-purple) 10%, transparent);
    border: 1px solid var(--border); color: var(--text); text-decoration: none;
    transition: all .3s; font-size: .95rem; backdrop-filter: blur(8px);
}
.links a:hover {
    background: color-mix(in srgb, var(--neon-pink) 18%, transparent);
    border-color: var(--neon-pink);
    box-shadow: 0 0 22px color-mix(in srgb, var(--neon-pink) 60%, transparent);
    transform: translateY(-3px) scale(1.05);
}

.section-title { text-align: center; font-size: 1.7rem; margin-bottom: 36px; color: var(--neon-blue); text-shadow: 0 0 20px color-mix(in srgb, var(--neon-blue) 70%, transparent); letter-spacing: 2px; }
.sections-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 24px; }
.section-card {
    position: relative; padding: 26px; border-radius: 22px;
    background: linear-gradient(145deg, color-mix(in srgb, var(--card-bg) 90%, transparent), color-mix(in srgb, var(--card-bg) 55%, transparent));
    border: 1px solid var(--border); cursor: pointer;
    transition: all .4s cubic-bezier(.2,.9,.3,1.2);
    overflow: hidden; backdrop-filter: blur(10px);
}
.section-card::before {
    content: ""; position: absolute; inset: -2px; border-radius: 24px;
    background: conic-gradient(from 0deg, transparent, var(--neon-pink), transparent, var(--neon-blue), transparent);
    opacity: 0; transition: opacity .4s; z-index: -1;
    animation: rotateBorder 6s linear infinite;
}
@keyframes rotateBorder { to { transform: rotate(360deg); } }
.section-card:hover::before { opacity: .6; }
.section-card::after {
    content: "✦"; position: absolute; top: 12px; right: 16px;
    color: var(--neon-pink); opacity: .7; font-size: 1.1rem;
    animation: twinkle 3s ease-in-out infinite;
}
@keyframes twinkle { 0%,100% { opacity:.4; transform:scale(1); } 50% { opacity:1; transform:scale(1.2); } }
.section-card:hover { transform: translateY(-6px); border-color: color-mix(in srgb, var(--neon-pink) 60%, transparent); box-shadow: 0 12px 40px color-mix(in srgb, var(--neon-pink) 30%, transparent); }
.section-card h3 { font-size: 1.25rem; margin-bottom: 8px; }
.section-card p { color: var(--text-dim); font-size: .9rem; line-height: 1.5; }
.section-card__badge {
    display: inline-block; margin-top: 12px; padding: 3px 10px; font-size: .75rem;
    border-radius: 999px; background: rgba(255,77,109,.2); color: #ff8fa3; border: 1px solid rgba(255,77,109,.4);
}
.section-card__count { margin-top: 14px; font-size: .8rem; color: var(--neon-blue); display: flex; align-items: center; gap: 6px; }

.page-header { text-align: center; padding: 20px 0 32px; position: relative; }
.page-header__back {
    display: inline-flex; align-items: center; gap: 6px; margin-bottom: 20px;
    color: var(--text-dim); text-decoration: none; font-size: .9rem; transition: all .2s;
    padding: 8px 16px; border-radius: 999px; border: 1px solid transparent;
}
.page-header__back:hover { color: var(--neon-pink); border-color: var(--border); background: color-mix(in srgb, var(--neon-pink) 8%, transparent); }
.page-header h1 { font-size: clamp(1.6rem, 3.5vw, 2.4rem); margin-bottom: 12px; }
.page-header p { color: var(--text-dim); max-width: 640px; margin: 0 auto; line-height: 1.6; }

.section-head {
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;
    margin-bottom: 28px; padding: 16px 20px;
    background: color-mix(in srgb, var(--card-bg) 60%, transparent);
    border: 1px solid var(--border); border-radius: 16px; backdrop-filter: blur(10px);
}
.section-head__title { font-size: 1rem; color: var(--text-dim); letter-spacing: 1px; }
.btn-add-post {
    display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px; border-radius: 999px; border: none;
    background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
    color: #fff; font-weight: 700; font-size: .95rem; cursor: pointer; transition: all .3s;
    box-shadow: 0 0 20px color-mix(in srgb, var(--neon-pink) 40%, transparent); font-family: inherit;
}
.btn-add-post:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 0 34px color-mix(in srgb, var(--neon-pink) 70%, transparent); }
.btn-add-post__plus { font-size: 1.3rem; line-height: 1; }

.post-add-card {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    aspect-ratio: 1; min-height: 220px; border-radius: 18px;
    background: color-mix(in srgb, var(--card-bg) 40%, transparent);
    border: 2px dashed var(--border); color: var(--text-dim); cursor: pointer;
    transition: all .3s; text-align: center; padding: 20px; backdrop-filter: blur(6px);
}
.post-add-card:hover { border-color: var(--neon-pink); color: var(--neon-pink); box-shadow: 0 0 30px var(--glow); transform: scale(1.03); background: color-mix(in srgb, var(--neon-pink) 8%, transparent); }
.post-add-card__plus { font-size: 3.2rem; line-height: 1; margin-bottom: 8px; font-weight: 300; }
.post-add-card__label { font-size: .9rem; }

.posts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
.post-card {
    border-radius: 18px; overflow: hidden; background: var(--card-bg); border: 1px solid var(--border);
    cursor: pointer; transition: all .35s cubic-bezier(.2,.9,.3,1.2); position: relative;
}
.post-card:hover { transform: translateY(-4px) scale(1.02); border-color: var(--neon-blue); box-shadow: 0 10px 30px color-mix(in srgb, var(--neon-blue) 35%, transparent); }
.post-card__img-wrap { position: relative; overflow: hidden; }
.post-card img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; transition: transform .6s ease; }
.post-card:hover img { transform: scale(1.08); }
.post-card__count {
    position: absolute; top: 10px; right: 10px; padding: 4px 10px; border-radius: 999px;
    background: rgba(0,0,0,.65); backdrop-filter: blur(8px); color: #fff; font-size: .75rem;
    border: 1px solid rgba(255,255,255,.15); display: flex; align-items: center; gap: 4px;
}
.post-card__date {
    position: absolute; top: 10px; left: 10px; padding: 4px 10px; border-radius: 999px;
    background: rgba(0,0,0,.65); backdrop-filter: blur(8px); color: #fff; font-size: .72rem;
    border: 1px solid rgba(255,255,255,.15); display: flex; align-items: center; gap: 4px;
}
.post-card__title { padding: 12px 14px; font-size: .95rem; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.post-card__title::after { content: "→"; opacity: 0; transform: translateX(-6px); transition: all .3s; color: var(--neon-pink); }
.post-card:hover .post-card__title::after { opacity: 1; transform: none; }

/* ===== ЗАКАЗЫ (публично) ===== */
.order-card {
    background: var(--card-bg); border: 1px solid var(--border); border-left: 4px solid var(--neon-purple);
    border-radius: 16px; padding: 16px 20px; margin-bottom: 14px; backdrop-filter: blur(10px);
}
.order-card__top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.order-card__client { font-weight: 700; }
.order-card__desc { color: var(--text-dim); font-size: .9rem; margin-top: 6px; white-space: pre-wrap; line-height: 1.5; }
.order-card__info { font-size: .8rem; color: var(--text-dim); margin-top: 8px; opacity: .85; }
.badge { font-size: .7rem; padding: 4px 14px; border-radius: 999px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
.b-new { background: #3b82f622; color: #60a5fa; border: 1px solid #3b82f655; }
.b-work { background: #f59e0b22; color: #fbbf24; border: 1px solid #f59e0b55; }
.b-done { background: #22c55e22; color: #4ade80; border: 1px solid #22c55e55; }

/* ===== ЛАЙТБОКС ===== */
.lightbox {
    position: fixed; inset: 0; background: rgba(3,1,10,.94); backdrop-filter: blur(16px);
    z-index: 950; display: flex; flex-direction: column; animation: lbIn .35s ease;
}
@keyframes lbIn { from { opacity: 0; } to { opacity: 1; } }
.lightbox__top {
    display: flex; justify-content: space-between; align-items: center; padding: 16px 24px;
    border-bottom: 1px solid color-mix(in srgb, var(--border) 60%, transparent); flex-shrink: 0;
}
.lightbox__counter { font-size: .9rem; color: var(--text-dim); letter-spacing: 2px; }
.lightbox__actions { display: flex; gap: 8px; }
.lb-btn {
    width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--border);
    background: color-mix(in srgb, var(--card-bg) 80%, transparent); color: var(--text);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem; transition: all .25s; font-family: inherit;
}
.lb-btn:hover { border-color: var(--neon-pink); color: var(--neon-pink); box-shadow: 0 0 16px var(--glow); transform: scale(1.08); }
.lb-btn:disabled { opacity: .25; cursor: not-allowed; transform: none; box-shadow: none; }
.lb-btn--danger:hover { border-color: #ff8fa3; color: #ff8fa3; }
.lightbox__body { flex: 1; display: flex; overflow: hidden; position: relative; }
.lightbox__stage { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; padding: 24px; min-width: 0; }
.lightbox__img-wrap { max-width: 100%; max-height: 100%; position: relative; display: flex; align-items: center; justify-content: center; }
.lightbox__img {
    max-width: 100%; max-height: calc(100vh - 260px); border-radius: 16px;
    box-shadow: 0 20px 80px rgba(0,0,0,.6), 0 0 60px var(--glow);
    object-fit: contain; transition: transform .35s ease; cursor: zoom-in; display: block;
}
.lightbox__img.zoomed { transform: scale(1.8); cursor: zoom-out; border-radius: 8px; }
.lb-arrow {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--border);
    background: color-mix(in srgb, var(--card-bg) 80%, transparent); color: var(--text); font-size: 1.5rem;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all .25s; backdrop-filter: blur(10px); z-index: 2; font-family: inherit;
}
.lb-arrow:hover {
    background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
    border-color: transparent; color: #fff;
    box-shadow: 0 0 24px color-mix(in srgb, var(--neon-pink) 70%, transparent);
    transform: translateY(-50%) scale(1.1);
}
.lb-arrow:disabled { opacity: .2; pointer-events: none; }
.lb-arrow--prev { left: 16px; }
.lb-arrow--next { right: 16px; }
.lightbox__info {
    width: 380px; flex-shrink: 0; padding: 28px 24px;
    border-left: 1px solid color-mix(in srgb, var(--border) 60%, transparent);
    overflow-y: auto; background: color-mix(in srgb, var(--bg-deep) 40%, transparent);
}
.lightbox__title { font-size: 1.5rem; margin-bottom: 12px; color: var(--neon-blue); line-height: 1.3; }
.lightbox__meta { display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
.lightbox__author { display: flex; align-items: center; gap: 8px; font-size: .9rem; color: var(--neon-pink); }
.lightbox__date { display: flex; align-items: center; gap: 8px; font-size: .85rem; color: var(--text-dim); }
.lightbox__desc { color: var(--text-dim); line-height: 1.7; margin-bottom: 24px; white-space: pre-wrap; }
.lb-links-title { font-size: .8rem; color: var(--neon-blue); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 12px; opacity: .8; }
.lb-links { display: flex; flex-direction: column; gap: 8px; }
.lb-link {
    display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px;
    background: color-mix(in srgb, var(--neon-purple) 10%, transparent);
    border: 1px solid var(--border); color: var(--text); text-decoration: none;

function toInputDate(iso) {
    if (!iso) return '';
    try { const d = new Date(iso); if (isNaN(d.getTime())) return ''; return d.toISOString().slice(0, 10); } catch(e) { return ''; }
}
function rgbToHex(rgb) {
    if (!rgb) return '#ffffff';
    rgb = rgb.trim();
    if (rgb.startsWith('#')) return rgb;
    const m = rgb.match(/\d+/g);
    if (!m) return '#ffffff';
    return '#' + m.slice(0, 3).map(n => (+n).toString(16).padStart(2, '0')).join('');
}
function hexToRgba(hex, alpha) {
    const m = hex.replace('#','').match(/.{1,2}/g);
    if (!m) return `rgba(168,85,247,${alpha})`;
    const [r,g,b] = m.map(x => parseInt(x, 16));
    return `rgba(${r},${g},${b},${alpha})`;
}

/* ============================================================
   СЖАТИЕ ИЗОБРАЖЕНИЙ
   ============================================================ */
const MAX_IMAGE_DIM = 1600;
const JPEG_QUALITY = 0.82;
const MAX_FILE_SIZE = 12 * 1024 * 1024;

function compressImage(file) {
    return new Promise((resolve, reject) => {
        if (file.size > MAX_FILE_SIZE) return reject(new Error(`Файл слишком большой (${(file.size/1024/1024).toFixed(1)} МБ). Максимум 12 МБ.`));
        if (file.type === 'image/gif') {
            const reader = new FileReader();
            reader.onload = () => resolve({ dataUrl: reader.result, originalSize: file.size, newSize: file.size, skipped: true });
            reader.onerror = reject;
            reader.readAsDataURL(file);
            return;
        }
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
            URL.revokeObjectURL(url);
            let { width, height } = img;
            const ratio = Math.min(1, MAX_IMAGE_DIM / Math.max(width, height));
            width = Math.round(width * ratio);
            height = Math.round(height * ratio);
            const canvas = document.createElement('canvas');
            canvas.width = width; canvas.height = height;
            canvas.getContext('2d').drawImage(img, 0, 0, width, height);
            let dataUrl;
            try {
                dataUrl = canvas.toDataURL('image/webp', JPEG_QUALITY);
                if (!dataUrl.startsWith('data:image/webp')) dataUrl = canvas.toDataURL('image/jpeg', JPEG_QUALITY);
            } catch(e) { dataUrl = canvas.toDataURL('image/jpeg', JPEG_QUALITY); }
            const newSize = Math.round((dataUrl.length - 'data:image/webp;base64,'.length) * 0.75);
            resolve({ dataUrl, originalSize: file.size, newSize, skipped: false });
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Не удалось прочитать изображение')); };
        img.src = url;
    });
}
function formatBytes(bytes) {
    if (bytes < 1024) return bytes + ' Б';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + ' КБ';
    return (bytes / 1024 / 1024).toFixed(1) + ' МБ';
}

function applyTheme() {
    const data = DB.get();
    const root = document.documentElement;
    const keys = ['bg-deep','bg-mid','neon-pink','neon-purple','neon-blue','text','text-dim','card-bg','border','glow'];

        document.body.className = data.theme || 'theme-bi';

}

    document.querySelectorAll('[data-text]').forEach(el => { el.textContent = T(el.dataset.text); });

(function initStars() {
    const canvas = document.getElementById('starfield');
    const ctx = canvas.getContext('2d');
    let stars = [];
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        stars = [];
        const count = Math.floor((canvas.width * canvas.height) / 4000);
        for (let i = 0; i < count; i++) {
            stars.push({
                x: Math.random() * canvas.width, y: Math.random() * canvas.height,
                r: Math.random() * 1.5 + 0.3, a: Math.random(),
                speed: Math.random() * 0.02 + 0.005,
                hue: Math.random() < 0.7 ? 0 : (Math.random() < 0.5 ? 320 : 200)
            });
        }
    }
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (const s of stars) {
            s.a += s.speed;
            const alpha = 0.4 + Math.abs(Math.sin(s.a)) * 0.6;
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
            ctx.fillStyle = s.hue === 0 ? `rgba(255,255,255,${alpha})` : s.hue === 320 ? `rgba(255,94,203,${alpha})` : `rgba(94,203,255,${alpha})`;
            ctx.fill();
        }
        requestAnimationFrame(draw);
    }
    window.addEventListener('resize', resize);
    resize(); draw();
})();

function getRoute() { return location.hash.replace(/^#/, '') || '/'; }

function route() {
    applyTheme();
    applyStaticTexts();
    const path = getRoute();
    const root = document.getElementById('route');
    root.innerHTML = '';

    document.querySelectorAll('.topnav__links a').forEach(a => {
        a.classList.toggle('active', a.dataset.nav === path);
    });

    if (path === '/' || path === '') renderHome(root);
    else if (path === '/profile') renderProfilePage(root);
    else if (path === '/admin') renderAdminPage(root);
    else if (path === '/orders') renderOrdersPage(root);
    else if (path.startsWith('/section/')) renderSectionPage(root, path.split('/')[2]);
    else root.innerHTML = `<p class="empty-note" style="text-align:center;">${esc(T('sectionNotFound'))}</p>`;

    window.scrollTo({ top: 0, behavior: 'smooth' });
}
window.addEventListener('hashchange', route);

const LB = {
    post: null, images: [], links: [], index: 0, zoomed: false,

    open(post) {
        this.post = normalizePost(JSON.parse(JSON.stringify(post)));
        this.images = this.post.images.length ? this.post.images : [DEFAULT_AVATAR];
        this.links = this.post.links || [];
        this.index = 0;
        this.zoomed = false;
        document.getElementById('lightbox').classList.remove('hidden');
        document.body.style.overflow = 'hidden';
        this.render();
    },
    close() {
        document.getElementById('lightbox').classList.add('hidden');
        document.body.style.overflow = '';
    },
    render() {
        const total = this.images.length;
        document.getElementById('lbCounter').textContent = `${this.index + 1} / ${total}`;
        document.getElementById('lbImg').src = this.images[this.index];
        document.getElementById('lbImg').classList.toggle('zoomed', this.zoomed);
        document.getElementById('lbPrev').disabled = total <= 1;
        document.getElementById('lbNext').disabled = total <= 1;

        const dateStr = formatDate(this.post.createdAt);
        const linksHtml = this.links.length ? `
            <div class="lb-links-title">✦ Ссылки ✦</div>
            <div class="lb-links">
                ${this.links.map(l => `
                    <a class="lb-link" href="${esc(l.url)}" target="_blank" rel="noopener">
                        <span class="lb-link__icon">🔗</span>
                        <span class="lb-link__text">${esc(l.name || l.url)}</span>
                    </a>`).join('')}
            </div>` : '';

        document.getElementById('lbInfo').innerHTML = `
            <h2 class="lightbox__title">${esc(this.post.title)}</h2>
            <div class="lightbox__meta">
                <div class="lightbox__author">© ${esc(this.post.author || T('copyrightDefault'))}${esc(T('copyrightSuffix'))}</div>
                ${dateStr ? `<div class="lightbox__date">📅 ${esc(dateStr)}</div>` : ''}
            </div>
            <p class="lightbox__desc">${esc(this.post.desc || '')}</p>
            ${linksHtml}
        `;

        const thumbs = document.getElementById('lbThumbs');
        thumbs.innerHTML = '';
        if (total > 1) {
            this.images.forEach((img, i) => {
                const t = document.createElement('button');
                t.className = 'lb-thumb' + (i === this.index ? ' active' : '');
                t.innerHTML = `<img src="${esc(img)}" alt="">`;
                t.onclick = () => { this.index = i; this.zoomed = false; this.render(); };
                thumbs.appendChild(t);
            });
        }
    },
    prev() { if (this.images.length <= 1) return; this.index = (this.index - 1 + this.images.length) % this.images.length; this.zoomed = false; this.render(); },
    next() { if (this.images.length <= 1) return; this.index = (this.index + 1) % this.images.length; this.zoomed = false; this.render(); },
    toggleZoom() { this.zoomed = !this.zoomed; this.render(); },
    copy() {
        navigator.clipboard.writeText(this.images[this.index])
            .then(() => showToast('Ссылка скопирована ✦'))
            .catch(() => showToast('Не удалось скопировать'));
    },
    edit() {
        const fresh = DB.get().posts.find(p => p.id === this.post.id);
        if (!fresh) { showToast('Пост не найден'); return; }
        this.close();
        openPostModal(fresh.sectionId, fresh, () => route());
    },
    delete() {
        if (!confirm(`Удалить пост «${this.post.title}»?`)) return;
        DB.removePost(this.post.id);
        this.close();
        showToast('Пост удалён 🗑');
        route();
    }
};

document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('lbClose').onclick = () => LB.close();
    document.getElementById('lbPrev').onclick = () => LB.prev();
    document.getElementById('lbNext').onclick = () => LB.next();
    document.getElementById('lbCopy').onclick = () => LB.copy();
    document.getElementById('lbEdit').onclick = () => LB.edit();
    document.getElementById('lbDelete').onclick = () => LB.delete();
    document.getElementById('lbImg').onclick = () => LB.toggleZoom();

    const lightbox = document.getElementById('lightbox');
    lightbox.addEventListener('click', (e) => { if (e.target === lightbox) LB.close(); });
    document.addEventListener('keydown', (e) => {
        if (lightbox.classList.contains('hidden')) return;
        if (e.key === 'Escape') LB.close();
        else if (e.key === 'ArrowLeft') LB.prev();
        else if (e.key === 'ArrowRight') LB.next();
    });
});

/* ============================================================
   МОДАЛКА ПОСТА (добавление / редактирование)
   ============================================================ */
let pendingFiles = [];

function openPostModal(sectionId, editingPost, onSuccess) {
    const modal = document.getElementById('addPostModal');
    const isEdit = !!editingPost;
    const post = editingPost ? normalizePost(JSON.parse(JSON.stringify(editingPost))) : null;

    document.getElementById('postModalTitle').textContent = isEdit ? '✏️ Редактировать пост' : '➕ Добавить пост';
    document.getElementById('confirmAddPost').querySelector('span').textContent = isEdit ? '💾 Сохранить' : '💾 Добавить';

    document.getElementById('newPostTitle').value = post ? post.title : '';
    document.getElementById('newPostDesc').value = post ? (post.desc || '') : '';
    document.getElementById('newPostAuthor').value = post ? (post.author || '') : '';
    document.getElementById('newPostDate').value = post ? toInputDate(post.createdAt) : '';

    const linksBox = document.getElementById('newPostLinks');
    const imagesBox = document.getElementById('newPostImages');
    const previewsBox = document.getElementById('newPostFilePreviews');
    const compressInfo = document.getElementById('compressInfo');
    linksBox.innerHTML = ''; imagesBox.innerHTML = ''; previewsBox.innerHTML = '';
    compressInfo.textContent = '';
    pendingFiles = [];

    function addLinkRow(name = '', url = '') {
        const row = document.createElement('div');
        row.className = 'repeater-item';
        row.innerHTML = `
            <input type="text" placeholder="Название (напр. Telegram)" class="link-name" value="${esc(name)}">
            <input type="url" placeholder="https://..." class="link-url" value="${esc(url)}">
            <button type="button" class="repeater-remove" title="Удалить">✕</button>
        `;
        row.querySelector('.repeater-remove').onclick = () => row.remove();
        linksBox.appendChild(row);
    }
    function addImageUrlRow(value = '') {
        const row = document.createElement('div');
        row.className = 'repeater-item';
        row.innerHTML = `
            <input type="text" placeholder="https://... или base64" class="img-url" value="${esc(value)}">
            <button type="button" class="repeater-remove" title="Удалить">✕</button>
        `;
        row.querySelector('.repeater-remove').onclick = () => row.remove();
        imagesBox.appendChild(row);
    }

    if (post) {
        if (post.links.length) post.links.forEach(l => addLinkRow(l.name, l.url));
        else addLinkRow();
        if (post.images.length) post.images.forEach(img => addImageUrlRow(img));
        else addImageUrlRow();
    } else {
        addLinkRow();
        addImageUrlRow();
    }

    document.getElementById('addNewLinkRow').onclick = () => addLinkRow();
    document.getElementById('addNewImageUrl').onclick = () => addImageUrlRow();

    const fileInput = document.getElementById('newPostImgFile');
    fileInput.onchange = async () => {
        compressInfo.textContent = 'Сжимаю изображения...';
        for (const file of Array.from(fileInput.files)) {
            try {
                const result = await compressImage(file);
                pendingFiles.push({ file, ...result });
                addFilePreview(file, result);
                const saved = result.skipped ? 0 : Math.max(0, result.originalSize - result.newSize);
                const savedPct = result.originalSize > 0 ? Math.round((saved / result.originalSize) * 100) : 0;
                compressInfo.textContent = result.skipped
                    ? `GIF сохранён без сжатия (${formatBytes(result.originalSize)})`
                    : `Сжато: ${formatBytes(result.originalSize)} → ${formatBytes(result.newSize)} (−${savedPct}%)`;
            } catch(err) { alert(err.message); }
        }
        fileInput.value = '';
    };

    function addFilePreview(file, result) {
        const el = document.createElement('div');
        el.className = 'file-preview';
        el.innerHTML = `
            <img src="${result.dataUrl}" alt="">
            <div class="file-preview__info">
                <div class="file-preview__name">${esc(file.name)}</div>
                <div class="file-preview__size">${formatBytes(result.originalSize)} → ${formatBytes(result.newSize)}</div>
            </div>
            <button type="button" class="file-preview__remove" title="Удалить">✕</button>
        `;
        el.querySelector('.file-preview__remove').onclick = () => {
            pendingFiles = pendingFiles.filter(p => p !== result);
            el.remove();
        };
        previewsBox.appendChild(el);
    }

    modal.classList.remove('hidden');
    document.body.style.overflow = 'hidden';

    function close() {
        modal.classList.add('hidden');
        document.body.style.overflow = '';
    }
    document.getElementById('closeAddPost').onclick = close;
    document.getElementById('cancelAddPost').onclick = close;
    modal.onclick = (e) => { if (e.target === modal) close(); };

    document.getElementById('confirmAddPost').onclick = () => {
        const title = document.getElementById('newPostTitle').value.trim();
        const desc = document.getElementById('newPostDesc').value.trim();
        const author = document.getElementById('newPostAuthor').value.trim();
        const dateInput = document.getElementById('newPostDate').value;

        if (!title) return alert('Введите название поста');

        let createdAt;
        if (dateInput) createdAt = new Date(dateInput + 'T12:00:00').toISOString();
        else if (isEdit && post.createdAt) createdAt = post.createdAt;
        else createdAt = new Date().toISOString();

        const links = [];
        linksBox.querySelectorAll('.repeater-item').forEach(row => {
            const name = row.querySelector('.link-name').value.trim();
            const url = row.querySelector('.link-url').value.trim();
            if (url) links.push({ name: name || url, url });
        });

        const images = [];
        imagesBox.querySelectorAll('.repeater-item').forEach(row => {
            const url = row.querySelector('.img-url').value.trim();
            if (url) images.push(url);
        });
        pendingFiles.forEach(p => images.push(p.dataUrl));

        if (images.length === 0) return alert('Добавьте хотя бы одну картинку (URL или файл)');

        if (isEdit) {
            DB.updatePost(post.id, { title, desc, author, images, links, createdAt });
            showToast('Пост обновлён ✦');
        } else {
            DB.addPost({ sectionId, title, desc, author, images, links, createdAt });
            showToast('Пост добавлен ✦');
        }
        close();
        if (onSuccess) onSuccess();
    };
}

    function getCurrentColors() {
        const d = DB.get();
        if (d.theme === 'theme-custom' && d.customColors) return d.customColors;
        const cs = getComputedStyle(document.body);
        const colors = {};
        COLOR_FIELDS.forEach(f => { colors[f.key] = rgbToHex(cs.getPropertyValue('--' + f.key).trim()); });
        return colors;
    }
    const initialColors = getCurrentColors();

    COLOR_FIELDS.forEach(f => {
        const wrap = document.createElement('div');
        wrap.className = 'form-group';
        wrap.style.marginBottom = '0';
        wrap.innerHTML = `
            <label>${f.label}</label>
            <div style="display:flex; gap:8px; align-items:center;">
                <input type="color" data-key="${f.key}" value="${initialColors[f.key] || '#ffffff'}"
                       style="width:56px; height:42px; padding:2px; border-radius:8px; border:1px solid var(--border); background:none; cursor:pointer;">
                <input type="text" data-key="${f.key}" value="${initialColors[f.key] || '#ffffff'}"
                       style="flex:1; padding:10px; background:color-mix(in srgb, var(--bg-deep) 70%, transparent);
                              border:1px solid var(--border); border-radius:10px; color:var(--text); font-family:monospace;">
            </div>
        `;
        const [colorInput, textInput] = wrap.querySelectorAll('input');
        colorInputs[f.key] = { color: colorInput, text: textInput };
        const preview = (val) => { if (/^#[0-9a-fA-F]{6}$/.test(val)) document.documentElement.style.setProperty('--' + f.key, val); };
        colorInput.oninput = () => { textInput.value = colorInput.value; preview(colorInput.value); };
        textInput.oninput = () => {
            if (/^#[0-9a-fA-F]{6}$/.test(textInput.value)) { colorInput.value = textInput.value; preview(textInput.value); }
        };
        colorGrid.appendChild(wrap);
    });

    function syncColorInputsFromTheme(themeId) {
        const oldClass = document.body.className;
        document.body.className = themeId;
        const cs = getComputedStyle(document.body);
        COLOR_FIELDS.forEach(f => {
            const hex = rgbToHex(cs.getPropertyValue('--' + f.key).trim());
            if (colorInputs[f.key]) { colorInputs[f.key].color.value = hex; colorInputs[f.key].text.value = hex; }
        });
        document.body.className = oldClass;
    }

    page.querySelector('#saveCustomTheme').onclick = () => {
        const colors = {};
        COLOR_FIELDS.forEach(f => { colors[f.key] = colorInputs[f.key].text.value; });

        colors['border']  = hexToRgba(colors['neon-purple'], 0.3);
        colors['glow']    = hexToRgba(colors['neon-purple'], 0.28);

                    ? `<textarea data-textkey="${item.key}">${esc(val)}</textarea>`
                    : `<input type="text" data-textkey="${item.key}" value="${esc(val)}">`}
            `;
            groupEl.appendChild(fg);
        });
        textsGrid.appendChild(groupEl);
    });

    page.querySelector('#saveTexts').onclick = () => {
        const patch = {};
        textsGrid.querySelectorAll('[data-textkey]').forEach(el => { patch[el.dataset.textkey] = el.value; });
        DB.saveTexts(patch);
        applyStaticTexts();
        showToast('Тексты сохранены ✦');
    };
    page.querySelector('#resetTexts').onclick = () => {
        if (!confirm('Сбросить все тексты к стандартным?')) return;

        showToast('Тексты сброшены ✦');

    };

    /* === Профиль === */
    page.querySelector('#saveProfile').onclick = async () => {
        const avatarInput = page.querySelector('#cfgAvatar').value.trim();
        const fileInput = page.querySelector('#cfgAvatarFile');
        let avatar = avatarInput;
        if (fileInput.files && fileInput.files[0]) {
            try {
                const result = await compressImage(fileInput.files[0]);
                avatar = result.dataUrl;
            } catch(e) {
                avatar = await fileToBase64(fileInput.files[0]);
            }
        } else if (!avatar) {
            avatar = DB.get().profile.avatar;
        }
        DB.saveProfile({
            avatar,
            title: page.querySelector('#cfgTitle').value.trim(),
            bio: page.querySelector('#cfgBio').value.trim(),
            fullBio: page.querySelector('#cfgFullBio').value.trim()
        });
        showToast('Профиль сохранён ✦');
    };

    /* === Ссылки === */
    const linkAdmin = page.querySelector('#linkListAdmin');
    function refreshLinks() {
        const d = DB.get();
        linkAdmin.innerHTML = '';
        if (!d.links.length) { linkAdmin.innerHTML = '<p class="empty-note">Ссылок пока нет.</p>'; return; }
        d.links.forEach(link => {
            const row = document.createElement('div');
            row.className = 'item-row';
            row.innerHTML = `
                <span class="item-row__text">${esc(link.name)} — ${esc(link.url)}</span>
                <div class="item-row__actions"><button class="btn-del">Удалить</button></div>
            `;
            row.querySelector('.btn-del').onclick = () => { DB.removeLink(link.id); refreshLinks(); };
            linkAdmin.appendChild(row);
        });
    }
    refreshLinks();
    page.querySelector('#addLink').onclick = () => {
        const name = page.querySelector('#linkName').value.trim();
        const url = page.querySelector('#linkUrl').value.trim();
        if (!name || !url) return alert('Заполните название и URL');
        DB.addLink({ name, url });
        page.querySelector('#linkName').value = '';
        page.querySelector('#linkUrl').value = '';
        refreshLinks();
    };

    /* === Разделы === */
    const secAdmin = page.querySelector('#sectionAdminList');
    function refreshSections() {
        const d = DB.get();
        secAdmin.innerHTML = '';
        if (!d.sections.length) { secAdmin.innerHTML = '<p class="empty-note">Разделов пока нет.</p>'; return; }
        d.sections.forEach(sec => {
            const count = d.posts.filter(p => p.sectionId === sec.id).length;
            const row = document.createElement('div');
            row.className = 'item-row';
            row.innerHTML = `
                <span class="item-row__text">${esc(sec.name)} ${sec.adult ? '🔞' : ''} <span style="opacity:.6">(${count} ${esc(T('worksCount'))})</span></span>
                <div class="item-row__actions">
                    <button class="btn-edit">Переименовать</button>
                    <button class="btn-del">Удалить</button>
                </div>
            `;
            row.querySelector('.btn-edit').onclick = () => {
                const name = prompt('Название раздела:', sec.name);
                if (name === null) return;
                const desc = prompt('Описание:', sec.desc || '');
                if (desc === null) return;
                DB.renameSection(sec.id, name.trim() || sec.name, desc.trim());
                refreshSections();
            };
            row.querySelector('.btn-del').onclick = () => {
                if (confirm('Удалить раздел и все его посты?')) {
                    DB.removeSection(sec.id);
                    refreshSections();
                    showToast('Раздел удалён 🗑');
                }
            };
            secAdmin.appendChild(row);
        });
    }
    refreshSections();
    page.querySelector('#addSection').onclick = () => {
        const name = page.querySelector('#secName').value.trim();
        const desc = page.querySelector('#secDesc').value.trim();
        const adult = page.querySelector('#secAdult').checked;
        if (!name) return alert('Введите название раздела');
        DB.addSection({ name, desc, adult });
        page.querySelector('#secName').value = '';
        page.querySelector('#secDesc').value = '';
        page.querySelector('#secAdult').checked = false;
        refreshSections();
    };

    /* === Безопасность / данные === */
    page.querySelector('#savePass').onclick = () => {
        const p = page.querySelector('#newPass').value.trim();
        if (p.length < 3) return alert('Минимум 3 символа');
        DB.save({ adminPass: p });
        showToast('Пароль сменён 🔐');
    };
    page.querySelector('#exportData').onclick = () => {
        const blob = new Blob([JSON.stringify(DB.get(), null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'starharlen_data.json';
        a.click();
    };
    page.querySelector('#importFile').onchange = (ev) => {
        const f = ev.target.files[0];
        if (!f) return;
        const r = new FileReader();
        r.onload = e => {
            try {
                const d = DB._migrate(JSON.parse(e.target.result));
                DB._save(d);
                showToast('Данные загружены ✦');
                route();
            } catch(err) { alert('Ошибка файла'); }
        };
        r.readAsText(f);
        ev.target.value = '';
    };
    page.querySelector('#wipeAll').onclick = () => {
        if (!confirm('Точно сбросить ВСЁ к заводским настройкам?')) return;
        localStorage.removeItem(DB._key);
        sessionStorage.clear();
        location.reload();
    };
}

/* ============================================================
   ФАЙЛ → BASE64 (fallback)
   ============================================================ */
function fileToBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}

/* ============================================================
   СТАРТ
   ============================================================ */
document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('year').textContent = new Date().getFullYear();
    applyTheme();
    applyStaticTexts();
    if (sessionStorage.getItem('ageConfirmed') === '1') route();
});
</script>
</body>
</html>
